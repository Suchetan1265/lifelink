spring:
  application:
    name: lifelink-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lifelink}
    username: ${DB_USER:lifelink_app}
    password: ${DB_PASSWORD:}

  jpa:
    # Flyway owns the schema; Hibernate only validates that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Exhausted retries are rejected rather than requeued, so they land
        # on the dead-letter queue instead of spinning forever (spec 8).
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2
          max-attempts: 4
          max-interval: 30s

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    # Blank credentials keep the email worker in log-only mode.
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}

  quartz:
    job-store-type: memory

  mvc:
    problemdetails:
      enabled: true

app:
  google:
    # Blank disables Google sign-in; the client hides the button when unset.
    client-id: ${GOOGLE_CLIENT_ID:}
  web:
    # Where password reset links point; the frontend origin.
    base-url: ${WEB_BASE_URL:http://localhost:5173}
  notifications:
    # Address the email worker sends from.
    from: ${MAIL_FROM:no-reply@lifelink.local}
  jwt:
    # No default on purpose: a shared signing key would let anyone mint tokens
    # for any deployment that forgot to override it. Startup fails without it.
    # HS256 needs at least 32 bytes. The dev profile supplies a throwaway one.
    secret: ${JWT_SECRET}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  admin:
    # Bootstraps the first ADMIN account when none exists (see AdminBootstrap).
    # Blank password means no admin is created, which AdminBootstrap warns about.
    email: ${ADMIN_EMAIL:admin@lifelink.local}
    password: ${ADMIN_PASSWORD:}

server:
  # Oracle XE also claims 8080 on some machines; override with SERVER_PORT.
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.hibernate.SQL: debug
