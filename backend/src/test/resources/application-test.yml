# Tests point at an embedded PostgreSQL wired up in IntegrationTest.
app:
  jwt:
    # application.yml has no default, so tests supply their own throwaway key.
    secret: test-only-signing-key-0123456789abcdef0123456789abcdef
  admin:
    email: admin@lifelink.test
    password: admin-test-password

spring:
  rabbitmq:
    listener:
      simple:
        # No broker in tests; publishing is asserted, delivery is not.
        auto-startup: false

  quartz:
    # Tests drive the maintenance services directly, so no timers fire.
    auto-startup: false

logging:
  level:
    org.hibernate.SQL: warn
