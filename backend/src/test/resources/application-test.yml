# Tests point at an embedded PostgreSQL wired up in IntegrationTest.
app:
  admin:
    email: admin@lifelink.test
    password: admin-test-password

spring:
  rabbitmq:
    listener:
      simple:
        # No broker in tests; publishing is asserted, delivery is not.
        auto-startup: false

  quartz:
    # Tests drive the maintenance services directly, so no timers fire.
    auto-startup: false

logging:
  level:
    org.hibernate.SQL: warn
